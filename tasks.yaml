# ---------- Trend Scout ----------
generate_topics:
  agent: trend_scout_agent
  description: >
    【唯一資料源】
    https://news.google.com/topics/CAAqJggKIiBDQkFTRWdvSUwyMHZNRFp1ZEdvU0FtVnVHZ0pWVXlnQVAB?hl=en-US&gl=US&ceid=US:en
    解析此頁面 <article> 標籤的前 10 條，忽略其他來源。

    【流程】
    0. 確保新聞日期是最新的
    1. 擷取 Top 10 標題與對應 URL；標題不得修改除去副標可縮寫 ≤15 字。
    2. 從標題中萃取 1~3 組關鍵字 (人名/隊伍/事件名)。
    3. 使用 GoogleTrendsTool 以「US」地區查每組關鍵字最近 7 天平均值
       (0–100)，若多關鍵字取最高值，作為 buzz_score（四捨五入整數）。
    4. 確保這 10 條至少涵蓋 ≥3 種運動 (NBA, MLB, NFL, UFC, Tennis …)。
       若不足，從排行 11–30 向下尋找其他運動替補並重算排名。
    5. 生成 Markdown 表格：
       | topic_title | topic_id(URL) | sport_type | buzz_score | keywords | data_angle |
       - **sport_type**：NBA / MLB / UFC / Tennis / Football…
       - **keywords**：用逗號列關鍵字
       - **data_angle**：給出可以量化的商業/統計切點
         (如獎金、轉播觀看數、門票漲幅、社媒互動)

  expected_output: >
    Markdown 表格 (10 列) + References 區 (列出實際 10 條 URL) + 新聞日期 (YYYY-MM-DD)
  output_file: topics.md


# ---------- Research ----------
research_topic:
  agent: research_analyst_agent
  context: [generate_topics]   # Runner 若跳過 generate_topics 會動態移除
  description: >
   你將收到單一字串 **{topic}**。請先對該字串做 NLP 分析以判斷：

      1. 所屬運動領域 (sport) ─ 例如 NBA、WNBA、UFC、EPL…
      2. 主要關係人 (entities) ─ 從人名 / 隊名 / 組織中擷取最多 2 位
         ‑ 若只偵測到 1 位則為「單主角」主題
         ‑ 偵測到 2 位則自動啟用「雙主角比較」模式

    接著生成 research_pack（Markdown），結構如下：

    ① timeline ‧ 至少 6 行 ‧ 倒序  
       | 日期 | 利害關係人 | 關鍵動作 | 商業數字 | 影響 | 出處 |
       - **利害關係人**：須覆蓋 3 角度 → (a) 管理機構/聯賽、(b) 運動員/經紀方、(c) 俱樂部/贊助商  
       - **商業數字**：票價、收視、簽約金、商品銷售額、社媒互動量等，並標單位  
       - **出處**：對應 references 的 [編號]

    ② stats ‧ 至少 5 行  
       | 指標 | 數值 | 單位 | 年份 | 出處 |
      ‑ 來源階層：官方聯盟 > Nielsen/Stathead/Sportico > 主流媒體
      ‑ 數據不夠可信時，留空並加註「缺官方資料」



    ③ article_summaries  
       - 精選 **5 篇** 來源文章，每篇 100–150 字摘要，說明內容亮點

    ④ storylines  
       - 4 條，每條 2–4 句，涵蓋：球員/教練視角、贊助/財報視角、歷史對比、未來預測。每條引用 [編號]

    ⑤ references  
       - 列完整可點擊 URL，並用 [1] [2]… 對應正文

    ▶ 如找不到可信商業數字，標 "N/A" 並解釋原因；嚴禁幻覺編造。
  expected_output: >
    ## timeline\n<table>…\n## stats\n<table>…
    \n## article_summaries\n…\n## storylines\n…\n## references\n…
  output_file: research.md



# ---------- Writer ----------
draft_xhs_post:
  agent: xhs_writer_agent
  context: [research_topic]
  description: >
    基於蒐集到的 fact-pack 找到故事切腳，創作爆款小紅書貼文（簡體中文）：
    關鍵技巧如下：
      1. 寫標題：
        - 采用具故事性、有悬念或對比的表述，如"鄭欽文打破白瘦幼審美的規訓"、"吳豔妮用事實証明，女性可以有多重身份"
        - 标题规则：口语化 + 20字以内 + 1-2 个相关 emoji
        - 適當加入感叹号、省略号增强表达
      2. 寫作技巧：
        - 寫作風格：親切熱情，适当使用专业术语，力保持通俗易懂，仿佛好友分享。
        - 分点式结构（如"3步搞定通勤妆"）
        - 极简时间轴 + 符号化叙事突出关键年份和成就  
        - 加入数据统计和具体数字，增强内容可信度和信息密度
        - 透過 emoji 作為每模塊開頭，也可適當在句尾添加，但避免過度重複堆
      3. 內文
        - 內容結構：基於找到的切腳說明對應的運動成就和商業價值 、添加一到兩個互動關鍵，三個模塊以內
        - 字數 500 字內
        - 避免机器味，讓人不會一眼覺得是 ai 產文

      4. 寫 Hashtag：
        与标题和正文内容强相关的標籤，可以蹭热点，蹭高热度话题，使用爆款词，高热度名词，中文為主、英文為輔

      5.創作參考：≤2500 字，列完整脈絡與引用

    ### 標題
    ---
    正文…
    ---
    #tag1 #tag2 ...
    ---
    <創作參考>
  expected_output: >
    同上格式返回
  output_file: post.md

# ---------- Copy QA ----------
qa_post:
  agent: copy_qa_agent
  context: [draft_xhs_post]
  description: >
    審核字數/敏感詞/數據一致/Markdown 格式。
    通過→APPROVED；否則 REJECT + 問題列表 + 前120字 + TIMESTAMP
  expected_output: APPROVED 或 REJECT
  output_file: qa_post.md

# ---------- Prompt ----------
generate_image_prompts:
  agent: prompt_engineer_agent
  context: [qa_post]
  description: >
    依貼文主題生成最多 3 張 3:4 日漫風的生圖 prompt。
    圖片設計要求：
      1. 在圖片中體現最關鍵的數據、成就或是招牌運動動作（如MVP獎盃、賽場瞬間、標誌性動作等）
      2. 尺寸：3:4（豎版格式，適合小紅書）
      3. 風格：
        - 以日系運動漫畫為主，參考《排球少年》或《灌籃高手》的畫風，可以參考對應的動漫海報或電影封面圖結構
        - 畫風簡潔乾淨，線條清晰有力
        - 色彩鮮明但不過於飽和
        - 突出運動的動感和力量感
      4. 多張圖片的風格需保持一致（包括配色、線條風格、構圖方式）
      5. 首圖要求：
        - 重點展現故事人物的名場面或標誌性動作，並且要能夠吸引人點擊
  expected_output: Markdown prompt
  output_file: prompts.md

# ---------- Visual QA ----------
qa_image_prompts:
  agent: visual_qa_agent
  context: [generate_image_prompts]
  description: >
    驗證尺寸、風格一致、首圖文字（若有）、關鍵數據/動作。
    全部合格→APPROVED；否則 REJECT slide X – 原因
  expected_output: APPROVED 或 REJECT
  output_file: qa_prompts.md


